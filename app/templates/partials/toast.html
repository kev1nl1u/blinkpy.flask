<div
  x-show="toast.show"
  x-transition:enter="transition ease-[cubic-bezier(0.16,1,0.3,1)] duration-300"
  x-transition:enter-start="opacity-0 translate-y-3 scale-95"
  x-transition:enter-end="opacity-100 translate-y-0 scale-100"
  x-transition:leave="transition ease-in duration-180"
  x-transition:leave-start="opacity-100 translate-y-0"
  x-transition:leave-end="opacity-0 translate-y-2"
  class="fixed bottom-8 inset-x-4 max-w-sm mx-auto z-50 pointer-events-none"
  role="status" aria-live="polite"
>
  <div
    class="rounded-2xl px-4 py-3 flex items-center gap-3 shadow-xl"
    :style="{
      background: toast.type === 'success' ? 'rgb(var(--accent-r),var(--accent-g),var(--accent-b))' : toast.type === 'error' ? 'rgb(220,38,38)' : 'var(--raised)',
      border: toast.type === 'success' ? '1px solid rgb(var(--accent-r),var(--accent-g),var(--accent-b))' : toast.type === 'error' ? '1px solid rgb(220,38,38)' : '1px solid var(--border-s)',
      color: toast.type === 'success' || toast.type === 'error' ? '#FFFFFF' : 'var(--text)',
      boxShadow: '0 8px 30px var(--shadow)',
    }"
  >
    <svg x-show="toast.type === 'success'" class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
    </svg>
    <svg x-show="toast.type === 'error'" class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
    </svg>
    <svg x-show="toast.type === 'info'" class="w-4 h-4 flex-shrink-0 t-sub" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z" />
    </svg>
    <p class="text-sm font-medium" x-text="toast.message"></p>
  </div>
</div>
