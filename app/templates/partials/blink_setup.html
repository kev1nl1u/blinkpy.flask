<div
  x-show="currentView === 'blink-setup'"
  class="flex-1 flex flex-col items-center justify-center px-5 safe-top safe-bottom"
  x-transition:enter="transition ease-[cubic-bezier(0.16,1,0.3,1)] duration-350"
  x-transition:enter-start="opacity-0 translate-y-3"
  x-transition:enter-end="opacity-100 translate-y-0"
>
  <div class="w-full max-w-sm space-y-6">

    <div class="space-y-1.5">
      <div class="flex items-center justify-between gap-3 mb-4">
        <div class="w-12 h-12 rounded-2xl t-surface flex items-center justify-center flex-shrink-0" style="border:1px solid var(--border-s)">
          <svg class="w-6 h-6 t-accent" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
          </svg>
        </div>
        <div class="flex items-center gap-1">
          {% include 'partials/lang_switcher.html' %}
          <button
            @click="toggleTheme()"
            class="p-2 rounded-xl t-sub cursor-pointer t-smooth"
            style="transition: color 0.15s, background-color 0.15s"
             :aria-label="theme === 'dark' ? '{{ t('dashboard.dark_mode') }}' : '{{ t('dashboard.light_mode') }}'"
          >
            <svg x-show="theme === 'dark'" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
            </svg>
            <svg x-show="theme === 'light'" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
            </svg>
          </button>
        </div>
      </div>
      <h1 class="text-xl font-bold t-text">{{ t('blink_setup.connect_blink') }}</h1>
      <p class="text-sm t-sub">{{ t('blink_setup.enter_credentials') }}</p>
    </div>

    <form @submit.prevent="submitCredentials()" class="space-y-3">
      <div class="space-y-1.5">
        <label for="setup-email" class="block text-sm font-medium t-sub">{{ t('blink_setup.blink_email') }}</label>
        <input
          id="setup-email" x-model="creds.email"
          type="email" autocomplete="email" inputmode="email" required
          placeholder="{{ t('blink_setup.email_placeholder') }}"
          class="field"
        />
      </div>

      <div class="space-y-1.5">
        <label for="setup-password" class="block text-sm font-medium t-sub">{{ t('blink_setup.password') }}</label>
        <div class="relative">
          <input
            id="setup-password" x-model="creds.password"
            :type="showPassword ? 'text' : 'password'"
            autocomplete="current-password" required
            placeholder="{{ t('blink_setup.password_placeholder') }}"
            class="field" style="padding-right: 44px"
          />
          <button
            type="button"
            @click="showPassword = !showPassword"
            class="absolute right-3 top-1/2 -translate-y-1/2 p-1.5 t-sub cursor-pointer"
            style="transition: color 0.15s"
            :aria-label="showPassword ? '{{ t('blink_setup.hide_password') }}' : '{{ t('blink_setup.show_password') }}'"
          >
            <svg x-show="!showPassword" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>
            <svg x-show="showPassword" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
          </button>
        </div>
      </div>

      <div
        x-show="credsError" x-transition
        class="flex items-center gap-2 px-3 py-2.5 rounded-xl text-sm"
        style="background:rgba(220,38,38,0.08); border: 1px solid rgba(220,38,38,0.2)"
        role="alert" aria-live="assertive"
      >
        <svg class="w-4 h-4 flex-shrink-0 t-danger" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
        </svg>
        <p class="text-sm t-danger" x-text="credsError"></p>
      </div>

      <button type="submit" :disabled="credsLoading" class="btn-primary" style="margin-top: 24px;">
        <div x-show="credsLoading" class="w-4 h-4 rounded-full animate-spin" style="border:2px solid rgba(255,255,255,0.3); border-top-color:#fff"></div>
        <span x-text="credsLoading ? '{{ t('blink_setup.logging_in') }}' : '{{ t('blink_setup.login_to_blink') }}'"></span>
      </button>
    </form>

    <div class="text-center">
      <button @click="logout()" class="text-sm t-sub cursor-pointer" style="transition: color 0.15s">
        {{ t('blink_setup.logout_google') }}
      </button>
    </div>
  </div>
</div>
