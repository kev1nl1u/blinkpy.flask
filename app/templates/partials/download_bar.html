<div
  x-show="dl.active"
  x-transition:enter="transition ease-[cubic-bezier(0.16,1,0.3,1)] duration-300"
  x-transition:enter-start="opacity-0 translate-y-4"
  x-transition:enter-end="opacity-100 translate-y-0"
  x-transition:leave="transition ease-in duration-200"
  x-transition:leave-start="opacity-100 translate-y-0"
  x-transition:leave-end="opacity-0 translate-y-3"
  class="fixed bottom-0 inset-x-0 z-40 px-4 pb-5 safe-bottom pointer-events-none"
  aria-live="polite" role="status"
>
  <div class="max-w-sm mx-auto rounded-2xl overflow-hidden t-smooth" style="background: var(--surface); border: 1px solid var(--border-s); box-shadow: 0 8px 40px var(--shadow)">
    <!-- Top progress bar -->
    <div class="h-[3px]" style="background: var(--raised)">
      <div
        class="h-full"
        style="background: var(--accent); transition: width 0.5s cubic-bezier(0.4,0,0.2,1)"
        :style="`width: ${dl.total ? Math.round(dl.done / dl.total * 100) : 6}%`"
      ></div>
    </div>

    <div class="px-4 py-3 flex items-center gap-3">
      <div class="w-7 h-7 rounded-xl flex items-center justify-center flex-shrink-0 bg-accent-12">
        <svg class="w-3.5 h-3.5 t-accent" style="animation: dlBounce 1.1s ease-in-out infinite" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" />
        </svg>
      </div>
      <div class="flex-1 min-w-0">
         <p class="text-xs font-semibold t-text leading-none">{{ t('download.updating_videos') }}</p>
         <p class="text-xs t-sub mt-1 truncate" x-text="dl.current ? dl.current : '{{ t('download.connecting_blink_module') }}'"></p>
      </div>
      <p class="text-xs font-mono font-semibold t-accent flex-shrink-0 tabular-nums"
         x-text="dl.total ? `${dl.done} / ${dl.total}` : '…'"></p>
    </div>
  </div>
</div>
