<div
  x-show="currentView === 'blink-2fa'"
  class="flex-1 flex flex-col items-center justify-center px-5 safe-top safe-bottom"
  x-transition:enter="transition ease-[cubic-bezier(0.16,1,0.3,1)] duration-350"
  x-transition:enter-start="opacity-0 translate-y-3"
  x-transition:enter-end="opacity-100 translate-y-0"
>
  <div class="w-full max-w-sm space-y-6">
    <div class="space-y-1.5">
      <div class="flex items-center justify-between gap-3 mb-4">
        <div class="w-12 h-12 rounded-2xl t-surface flex items-center justify-center mb-4 bg-accent-8" style="border:1px solid var(--border-s)">
          <svg class="w-6 h-6 t-accent" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
          </svg>
        </div>
        <div class="flex items-center gap-1">
          {% include 'partials/lang_switcher.html' %}
          <button
            @click="toggleTheme()"
            class="p-2 rounded-xl t-sub cursor-pointer t-smooth"
            style="transition: color 0.15s, background-color 0.15s"
             :aria-label="theme === 'dark' ? '{{ t('dashboard.dark_mode') }}' : '{{ t('dashboard.light_mode') }}'"
          >
            <svg x-show="theme === 'dark'" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
            </svg>
            <svg x-show="theme === 'light'" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
            </svg>
          </button>
        </div>
      </div>
      <h1 class="text-xl font-bold t-text">{{ t('blink_2fa.verify_identity') }}</h1>
      <p class="text-sm t-sub">{{ t('blink_2fa.otp_sent') }}</p>
    </div>

    <form @submit.prevent="submit2FA()" class="space-y-3">
      <div class="space-y-1.5">
         <label for="screen-pin" class="block text-sm font-medium t-sub text-center">{{ t('blink_2fa.otp_label') }}</label>
        <input
          id="screen-pin" x-model="pinCode" x-ref="pinInputScreen"
          type="number" inputmode="numeric" autocomplete="one-time-code" required
           placeholder="{{ t('blink_2fa.otp_placeholder') }}"
          class="field text-center text-2xl font-mono tabular-nums"
          style="letter-spacing: 0.4em; padding-left: 20px"
        />
      </div>

      <div
        x-show="pinError" x-transition
        class="flex items-center gap-2 px-3 py-2.5 rounded-xl"
        style="background:rgba(220,38,38,0.08); border:1px solid rgba(220,38,38,0.2)"
        role="alert" aria-live="assertive"
      >
        <p class="text-sm t-danger" x-text="pinError"></p>
      </div>

      <button type="submit" :disabled="pinLoading || !pinCode" class="btn-primary" style="margin-top:24px">
        <div x-show="pinLoading" class="w-4 h-4 rounded-full animate-spin" style="border:2px solid rgba(255,255,255,0.3); border-top-color:#fff"></div>
         <span x-text="pinLoading ? '{{ t('blink_2fa.verifying') }}' : '{{ t('blink_2fa.verify_pin') }}'"></span>
      </button>
    </form>

    <div class="text-center">
      <button
        @click="awaiting2FA = false; creds = { email: '', password: '' }; credsError = ''"
        class="text-sm t-sub cursor-pointer"
      >
        {{ t('blink_2fa.back_to_credentials') }}
      </button>
    </div>
  </div>
</div>
